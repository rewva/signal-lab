[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-gk-quiz-selection"
version = "0.1.0"
description = "Deterministic topic-selection layer for the daily-gk-quiz skill"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["selection"]

[tool.pytest.ini_options]
testpaths = ["tests"]
